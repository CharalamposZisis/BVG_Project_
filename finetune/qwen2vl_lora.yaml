# LLaMA-Factory LoRA config for title/date extraction on BVG construction plans.
# Run on the HTW GPU cluster with:
#   llamafactory-cli train finetune/qwen2vl_lora.yaml
# See finetune/README.md for full setup steps.

### model
model_name_or_path: Qwen/Qwen2-VL-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: bvg_plans_train
eval_dataset: bvg_plans_val
dataset_dir: finetune/data          # must contain dataset_info.json + train.jsonl + val.jsonl + images/
template: qwen2_vl
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: finetune/output/qwen2vl_lora
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50
